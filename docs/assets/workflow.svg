<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <rect width="1000" height="320" fill="#FFFFFF"/>
  <defs>
