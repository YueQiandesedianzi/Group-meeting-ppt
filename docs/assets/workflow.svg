  <line x1="194" y1="123" x2="219" y2="123" stroke="#0F6FC6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="389" y1="123" x2="414" y2="123" stroke="#0F6FC6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="584" y1="123" x2="609" y2="123" stroke="#0F6FC6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="779" y1="123" x2="804" y2="123" stroke="#0F6FC6" stroke-width="1.6" marker-end="url(#arrow)"/>

